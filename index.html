<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mineral Markets Survey</title>
<style>
:root{--ink:#14213d;--muted:#5b6785;--blue:#1f5fbf;--blue-d:#174a96;--blue-l:#e8f0fc;--line:#d6deee;--bg:#f5f7fb;--card:#fff;--gold:#b8892b;--err:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:700;letter-spacing:.04em;color:var(--gold);font-size:14px;text-transform:uppercase}
.prog{height:4px;background:var(--line)}
.prog>div{height:4px;background:var(--blue);width:0;transition:width .25s}
main{max-width:860px;margin:0 auto;padding:24px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px 22px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);font-weight:600;margin-bottom:6px}
.qtitle{font-size:14px;color:var(--muted);margin:0 0 6px}
h1{font-size:22px;line-height:1.3;margin:0 0 6px}
.instr{color:var(--muted);font-size:14px;margin:0 0 18px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:#fff;user-select:none;text-align:left;width:100%;font:inherit;color:inherit}
.opt:hover{border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-l)}
.opt .mk{flex:0 0 20px;height:20px;border:2px solid #9fb0d3;border-radius:50%;margin-top:1px;position:relative}
.opt.multi .mk{border-radius:5px}
.opt.sel .mk{border-color:var(--blue);background:var(--blue)}
.opt.sel .mk:after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.opt.dis{opacity:.45;cursor:not-allowed}
.fam{font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px;text-transform:none}
.fam:first-child{margin-top:0}
.grow{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:#fff}
.grow.bad{border-color:var(--err);background:#fdf2f1}
.glabel{font-weight:600;margin-bottom:10px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;background:#fff;cursor:pointer;color:inherit;text-align:left}
.pill:hover{border-color:var(--blue)}
.pill.sel{border-color:var(--blue);background:var(--blue);color:#fff}
.pill.nv{border-style:dashed}
.pill.nv.sel{border-style:solid}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:12px 26px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:var(--blue-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--err);font-size:14px;min-height:20px}
.hint{color:var(--muted);font-size:14px;margin-top:10px}
.cnt{font-size:14px;color:var(--blue);font-weight:600}
.center{text-align:center;padding:40px 10px}
.center h1{margin-bottom:10px}
@media(max-width:560px){.card{padding:18px 14px}h1{font-size:19px}}
</style>
</head>

const NONCORE_FAMS=['Battery and storage','Nuclear','Magnet rare earths','Alloy and defence','Agricultural and industrial'];
const params=new URLSearchParams(location.search);
const REF=(params.get('ref')||'').trim();

const state={ref:REF,answers:{},idx:-1,startIso:null,order:{},cleared:false,saving:false,done:false};

const app=$('#app');
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function device(){const w=Math.min(screen.width||innerWidth,innerWidth);const ua=navigator.userAgent||'';if(/iPad|Tablet/i.test(ua)||(w>=600&&w<1024&&/Mobi|Android/i.test(ua)))return'Tablet';if(/Mobi|Android|iPhone/i.test(ua)||w<600)return'Mobile';return'Desktop'}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function post(payload){
  if(!SCRIPT_URL||SCRIPT_URL.indexOf('PASTE_')===0){console.log('POST (no endpoint configured)',payload);return Promise.resolve({ok:true,offline:true})}
  return fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(r=>r.json());
}
function get(q){
  if(!SCRIPT_URL||SCRIPT_URL.indexOf('PASTE_')===0)return Promise.resolve({});
  return fetch(SCRIPT_URL+'?'+q).then(r=>r.json());
}
function payload(status,last,dq){return{ref:state.ref,status:status,lastScreen:last,dqReason:dq||'',startIso:state.startIso,device:device(),answers:state.answers}}

/* ---------- item helpers ---------- */
function covered(){return (state.answers.S7||[]).slice()}
function rowsFor(it){
  if(it.rowsFrom==='covered')return covered().map(c=>({code:c,label:UNIVERSE[c-1]}));
  return it.rows;
}
function optsFor(it){
  if(it.pipeFrom){const sel=state.answers[it.pipeFrom]||[];return it.options.filter(o=>sel.indexOf(o.code)>=0)}
  return it.options;
}
function itemApplicable(it){
  if(it.pipeFrom){const n=optsFor(it).length;if(n===0)return false;if(n===1){state.answers[it.code]=optsFor(it)[0].code;return false}}
  if(it.rowsFrom==='covered'&&covered().length===0)return false;
  return true;
}
function nextIndex(from){
  for(let i=from+1;i<ITEMS.length;i++){if(itemApplicable(ITEMS[i]))return i}
  return -1;
}
function ordered(it,list,key,doRand){
  const k=it.code+'|'+key;
  if(!state.order[k]){
    const fixedTail=list.filter(x=>x.fixed&&doRand);
    const free=list.filter(x=>!(x.fixed&&doRand));
    state.order[k]=(doRand?shuffle(free):free).concat(fixedTail).map(x=>x.code);
  }
  const m={};list.forEach(x=>m[x.code]=x);
  return state.order[k].filter(c=>m[c]).map(c=>m[c]);
}
function progress(){
  const total=ITEMS.length;const pct=Math.max(0,Math.min(100,Math.round(((state.idx+1)/total)*100)));
  $('#pbar').style.width=pct+'%';$('#pg').textContent=state.idx>=0?pct+'%':'';
}

/* ---------- screens ---------- */
function syncAria(){document.querySelectorAll('.opt,.pill').forEach(x=>x.setAttribute('aria-pressed',x.classList.contains('sel')?'true':'false'))}
document.addEventListener('click',()=>setTimeout(syncAria,0));
function screen(html){app.innerHTML=html;window.scrollTo(0,0);syncAria()}
function showInvalid(){screen('<div class="card center"><h1>This link is not valid</h1><p>Please use the personal link you were sent.</p></div>')}
function showUsed(){screen('<div class="card center"><h1>This link has already been used</h1><p>Thank you for your interest in this survey.</p></div>')}
function showDQ(){screen('<div class="card center"><h1>Thank you for your time</h1><p>At this time, you don’t qualify for this particular survey. We appreciate your interest.</p></div>')}
function showThanks(){screen('<div class="card center"><h1>Thank you</h1><p>Your responses have been recorded. You can now close this window.</p></div>')}
function showIntro(){
  screen('<div class="card"><div class="eyebrow">Survey introduction</div><h1>Mineral commodity markets survey</h1>'+
  '<p>Thank you for taking part. This survey asks for your professional judgement on mineral commodity markets over the next five years.</p>'+
  '<p>It takes about 16 to 19 minutes. Your responses are confidential and reported in aggregate only.</p>'+
  '<div class="bar"><span></span><button class="btn" id="go">Start</button></div></div>');
  $('#go').onclick=()=>{state.startIso=new Date().toISOString();get('action=open&ref='+encodeURIComponent(state.ref)).catch(()=>{});goto(0)};
}
function goto(i){state.idx=i;progress();renderItem(ITEMS[i]);app.setAttribute('data-code',ITEMS[i].code)}
function head(it){
  return '<div class="eyebrow">'+esc(it.section)+'</div>'+(it.title?'<div class="qtitle">'+esc(it.title)+'</div>':'')+'<h1>'+esc(it.stem)+'</h1>'+'<p class="instr">'+esc(it.instr||'')+'</p>';
}
function footer(label){return '<div class="err" id="err"></div><div class="bar"><span class="cnt" id="cnt"></span><button class="btn" id="nx">'+(label||'Next')+'</button></div>'}
function renderItem(it){
  if(it.kind==='single')return renderSingle(it);
  if(it.kind==='multi'||it.kind==='exact8')return renderMulti(it);
  if(it.kind==='grid')return renderGrid(it);
  if(it.kind==='coverage')return renderCoverage(it);
}
function isLast(){return nextIndex(state.idx)===-1}
function setErr(m){const e=$('#err');if(e)e.textContent=m||''}

function renderSingle(it){
  const list=ordered(it,optsFor(it),'o',it.randOpts);
  let h='<div class="card">'+head(it)+'<div class="opts">';
  list.forEach(o=>{h+='<button type="button" class="opt'+(state.answers[it.code]===o.code?' sel':'')+'" data-c="'+o.code+'"><span class="mk"></span><span>'+esc(o.label)+'</span></button>'});
  h+='</div>'+footer(isLast()?'Submit':'Next')+'</div>';
  screen(h);
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    state.answers[it.code]=+b.dataset.c;
    document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));setErr('');
  });
  $('#nx').onclick=()=>{
    const v=state.answers[it.code];
    if(v===undefined){setErr('Please select one option.');return}
    const o=it.options.find(x=>x.code===v);
    if(o&&o.dq){return terminate(it.code,'Disqualified at '+it.code)}
    advance(it);
  };
}
function renderMulti(it){
  const list=ordered(it,optsFor(it),'o',it.randOpts);
  const cur=state.answers[it.code]=state.answers[it.code]||[];
  const exact=it.kind==='exact8'?it.exact:0;
  let h='<div class="card">'+head(it)+'<div class="opts">';
  list.forEach(o=>{h+='<button type="button" class="opt multi'+(cur.indexOf(o.code)>=0?' sel':'')+'" data-c="'+o.code+'"><span class="mk"></span><span>'+esc(o.label)+'</span></button>'});
  h+='</div>'+footer(isLast()?'Submit':'Next')+'</div>';
  screen(h);
  const cnt=()=>{if(exact)$('#cnt').textContent='Selected '+state.answers[it.code].length+' of '+exact};cnt();
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const c=+b.dataset.c;const o=it.options.find(x=>x.code===c);let a=state.answers[it.code];const i=a.indexOf(c);
    if(i>=0){a.splice(i,1)}
    else{
      if(o.excl){a.length=0}else{const ex=it.options.filter(x=>x.excl).map(x=>x.code);a=state.answers[it.code]=a.filter(x=>ex.indexOf(x)<0)}
      if(exact&&a.length>=exact){setErr('You can select exactly '+exact+'. Deselect one to change your choice.');return}
      a.push(c);
    }
    document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',state.answers[it.code].indexOf(+x.dataset.c)>=0));
    setErr('');cnt();
  });
  $('#nx').onclick=()=>{
    const a=state.answers[it.code];
    if(exact){if(a.length!==exact){setErr('Please select exactly '+exact+'.');return}}
    else if(a.length===0){setErr('Please select at least one option.');return}
    advance(it);
  };
}
function renderCoverage(it){
  const cur=state.answers[it.code]=state.answers[it.code]||[];
  let h='<div class="card">'+head(it)+'<div id="fams">';
  it.families.forEach(f=>{
    const list=ordered(it,it.options.filter(o=>o.family===f),'f:'+f,true);
    h+='<div class="fam">'+esc(f)+'</div><div class="opts">';
    list.forEach(o=>{h+='<button type="button" class="opt multi'+(cur.indexOf(o.code)>=0?' sel':'')+'" data-c="'+o.code+'"><span class="mk"></span><span>'+esc(o.label)+'</span></button>'});
    h+='</div>';
  });
  h+='</div>'+footer('Next')+'</div>';
  screen(h);
  const famOf={};it.options.forEach(o=>famOf[o.code]=o.family);
  const outside=()=>state.answers[it.code].filter(c=>NONCORE_FAMS.indexOf(famOf[c])>=0).length;
  const cnt=()=>{$('#cnt').textContent='Selected '+state.answers[it.code].length+' of '+it.max};cnt();
  let warned=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const c=+b.dataset.c;const a=state.answers[it.code];const i=a.indexOf(c);
    if(i>=0)a.splice(i,1);else{if(a.length>=it.max){setErr('You can select up to '+it.max+'. Deselect one to change your choice.');return}a.push(c)}
    b.classList.toggle('sel',a.indexOf(c)>=0);setErr('');cnt();
  });
  $('#nx').onclick=()=>{
    const a=state.answers[it.code];
    if(a.length===0){setErr('Please select at least one commodity.');return}
    if(outside()<it.softMinOutside&&!warned){warned=true;setErr('You have selected fewer than three commodities outside bulks, base metals and precious metals. If you actively cover others, please add them. Otherwise select Next again to continue.');return}
    state.cleared=true;advance(it);
  };
}
function renderGrid(it){
  const rows=ordered(it,rowsFor(it),'r',it.randRows);
  const opts=it.options;
  const cur=state.answers[it.code]=state.answers[it.code]||{};
  let h='<div class="card">'+head(it)+'<div id="rows">';
  rows.forEach(r=>{
    h+='<div class="grow" data-r="'+r.code+'"><div class="glabel">'+esc(r.label)+'</div><div class="pills">';
    opts.forEach(o=>{h+='<button type="button" class="pill'+(o.code===NV?' nv':'')+(cur[r.code]===o.code?' sel':'')+'" data-r="'+r.code+'" data-c="'+o.code+'">'+esc(o.label)+'</button>'});
    h+='</div></div>';
  });
  h+='</div>'+footer(isLast()?'Submit':'Next')+'</div>';
  screen(h);
  document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{
    const r=b.dataset.r,c=+b.dataset.c;cur[r]=c;
    document.querySelectorAll('.pill[data-r="'+r+'"]').forEach(x=>x.classList.toggle('sel',+x.dataset.c===c));
    const g=document.querySelector('.grow[data-r="'+r+'"]');if(g)g.classList.remove('bad');setErr('');
  });
  $('#nx').onclick=()=>{
    let first=null;
    rows.forEach(r=>{if(cur[r.code]===undefined){const g=document.querySelector('.grow[data-r="'+r.code+'"]');g.classList.add('bad');if(!first)first=g}});
    if(first){setErr('Please answer every row. Select No view if you do not hold a view.');first.scrollIntoView({block:'center'});return}
    advance(it);
  };
}

/* ---------- flow ---------- */
function advance(it){
  const n=nextIndex(state.idx);
  if(state.cleared&&n!==-1){post(payload('Partial',it.code)).catch(()=>{})}
  if(n===-1)return submit();
  goto(n);
}
function terminate(code,reason){
  lsSet('ms_used_'+state.ref,'1');
  post(payload('Disqualified',code,reason)).catch(()=>{});
  showDQ();
}
function submit(){
  const btn=$('#nx');if(btn){btn.disabled=true;btn.textContent='Submitting'}
  post(payload('Complete','Complete')).then(r=>{
    if(r&&r.ok===false)throw new Error('server');
    lsSet('ms_used_'+state.ref,'1');state.done=true;showThanks();$('#pbar').style.width='100%';$('#pg').textContent='';
  }).catch(()=>{
    if(btn){btn.disabled=false;btn.textContent='Submit'}setErr('Your responses could not be sent. Please check your connection and select Submit again.');
  });
}

/* ---------- start ---------- */
(function init(){
  if(!REF){showInvalid();return}
  if(!IS_TEST&&lsGet('ms_used_'+REF)){showUsed();return}
  get('action=checkLock&ref='+encodeURIComponent(REF)).then(r=>{
    if(r&&r.locked&&!IS_TEST){showUsed();return}
    showIntro();
  }).catch(()=>showIntro());
})();
</script>
